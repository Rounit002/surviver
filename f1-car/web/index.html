<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KESTREL 77 — F1 Studio Viewer</title>
  <style>
    :root { --accent: #ff4310; --ink: #eceae4; --dim: #8b8f98; --panel: rgba(12, 14, 18, .72); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #050607; color: var(--ink);
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    .panel { position: absolute; background: var(--panel); border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; backdrop-filter: blur(10px); padding: 12px 14px; pointer-events: auto; }
    #title { top: 18px; left: 18px; }
    #title h1 { margin: 0; font-size: 15px; letter-spacing: .22em; font-weight: 700; }
    #title h1 b { color: var(--accent); }
    #title p { margin: 3px 0 0; color: var(--dim); font-size: 12px; }
    #views { left: 18px; bottom: 18px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(720px, calc(100vw - 36px)); }
    #opts { top: 18px; right: 18px; display: grid; gap: 10px; min-width: 190px; }
    button, .chip { font: inherit; color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      border-radius: 7px; padding: 6px 11px; cursor: pointer; transition: background .15s, border-color .15s; }
    button:hover { background: rgba(255,255,255,.14); }
    button.on { border-color: var(--accent); background: rgba(255,67,16,.16); }
    label.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
    input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
    .sw { display: flex; gap: 7px; }
    .sw i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; }
    .sw i.on { border-color: #fff; }
    h3 { margin: 0 0 6px; font-size: 10px; letter-spacing: .18em; color: var(--dim); font-weight: 600; text-transform: uppercase; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #050607; z-index: 5;
      transition: opacity .6s; letter-spacing: .3em; font-size: 12px; color: var(--dim); }
    #loading.done { opacity: 0; pointer-events: none; }
    #bar { width: 220px; height: 2px; background: #1b1e24; margin: 14px auto 0; }
    #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    #hint { right: 18px; bottom: 18px; color: var(--dim); font-size: 12px; }
    @media (max-width: 720px) { #opts { top: auto; bottom: 76px; right: 18px; } #hint { display: none; } }
  </style>
</head>
<body>
  <div id="loading"><div>LOADING CAR<div id="bar"><i></i></div></div></div>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="title" class="panel"><h1>KESTREL <b>77</b></h1><p>Procedural F1 car · drag to orbit · scroll to zoom</p></div>
    <div id="opts" class="panel">
      <div><h3>Livery accent</h3><div class="sw" id="swatches"></div></div>
      <label class="row"><span>Auto-rotate</span><input type="checkbox" id="rot" checked></label>
      <label class="row"><span>Wheels rolling</span><input type="checkbox" id="spin"></label>
      <label class="row"><span>Steering sweep</span><input type="checkbox" id="steer"></label>
    </div>
    <div id="views" class="panel"></div>
    <div id="hint" class="panel">Right-drag pans · double-click a view button to re-frame</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
