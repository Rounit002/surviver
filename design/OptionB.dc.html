<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #B3A8D6; } a:hover { color: #9C90C4; }
  </style>
</helmet>

<div style="width: 460px; height: 340px; background: #1E1D22; box-sizing: border-box; padding: 26px; display: flex; align-items: flex-start;">

  <div style="width: 272px; background: #26252E; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 12px; box-sizing: border-box; padding: 12px 13px 11px; display: flex; flex-direction: column; gap: 9px;">

    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 6px; height: 6px; border-radius: 50%; background: #B3A8D6; flex: none;"></div>
      <div style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.15em; color: #8B8697;">TODAY</div>
      <div style="margin-left: auto; font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; color: #8B8697;">2 / 5</div>
    </div>

    <div style="height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden;">
      <div style="width: 40%; height: 100%; border-radius: 2px; background: #B3A8D6;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">

      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 14px; height: 14px; flex: none; border-radius: 4px; background: #B3A8D6; display: flex; align-items: center; justify-content: center;">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#26252E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg>
        </div>
        <div style="font-size: 12.5px; font-weight: 500; color: #726E7E; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #55515F;">Stream intro + chat</div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 14px; height: 14px; flex: none; border-radius: 4px; background: #B3A8D6; display: flex; align-items: center; justify-content: center;">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#26252E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg>
        </div>
        <div style="font-size: 12.5px; font-weight: 500; color: #726E7E; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #55515F;">Warm-up games</div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 14px; height: 14px; flex: none; border-radius: 4px; border: 1.5px solid rgba(255, 255, 255, 0.22); box-sizing: border-box;"></div>
        <div style="font-size: 12.5px; font-weight: 600; color: #EDEAF2;">Build the to-do overlay</div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 14px; height: 14px; flex: none; border-radius: 4px; border: 1.5px solid rgba(255, 255, 255, 0.14); box-sizing: border-box;"></div>
        <div style="font-size: 12.5px; font-weight: 500; color: #ABA6B6;">Viewer submissions</div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 14px; height: 14px; flex: none; border-radius: 4px; border: 1.5px solid rgba(255, 255, 255, 0.14); box-sizing: border-box;"></div>
        <div style="font-size: 12.5px; font-weight: 500; color: #ABA6B6;">Q&amp;A + outro</div>
      </div>

    </div>

  </div>

</div>
</x-dc>
</body>
</html>
