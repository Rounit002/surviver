<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #C2D2C4; } a:hover { color: #A6BAA9; }
  </style>
</helmet>

<div style="width: 460px; height: 340px; background: #1E1D22; box-sizing: border-box; padding: 26px; display: flex; align-items: flex-start;">

  <div style="width: 252px; display: flex; flex-direction: column; gap: 9px;">

    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 14px; height: 2px; border-radius: 1px; background: #A9C1A8; flex: none;"></div>
      <div style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.15em; color: #A9C1A8; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);">TODAY &middot; 2 / 5</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">

      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#7E8F84" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg>
        <div style="font-size: 12.5px; font-weight: 500; color: #7E7A74; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #5E5A55; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);">Stream intro + chat</div>
      </div>

      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#7E8F84" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg>
        <div style="font-size: 12.5px; font-weight: 500; color: #7E7A74; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #5E5A55; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);">Warm-up games</div>
      </div>

      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="width: 11px; display: flex; justify-content: center; flex: none;">
          <div style="width: 5px; height: 5px; border-radius: 50%; background: #A9C1A8;"></div>
        </div>
        <div style="font-size: 12.5px; font-weight: 600; color: #F0EDE6; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);">Build the to-do overlay</div>
      </div>

      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="width: 11px; display: flex; justify-content: center; flex: none;">
          <div style="width: 5px; height: 5px; border-radius: 50%; background: rgba(240, 237, 230, 0.28);"></div>
        </div>
        <div style="font-size: 12.5px; font-weight: 500; color: #BDB8AF; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);">Viewer submissions</div>
      </div>

      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="width: 11px; display: flex; justify-content: center; flex: none;">
          <div style="width: 5px; height: 5px; border-radius: 50%; background: rgba(240, 237, 230, 0.28);"></div>
        </div>
        <div style="font-size: 12.5px; font-weight: 500; color: #BDB8AF; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);">Q&amp;A + outro</div>
      </div>

    </div>

  </div>

</div>
</x-dc>
</body>
</html>
