<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>To-Do Overlay — local test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');

/* ───────── tokens (all overwritten by the widget fields) ───────── */
#todo-wrap {
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --w: 262px;
  --fs: 13px;
  --gap: 5px;
  --radius: 8px;
  --pad-y: 7px;
  --pad-x: 10px;
  --dur: 320ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  --head-color: #DCD6CA;
  --count-color: #9E988C;

  --todo-bg: #EDE9E0;
  --todo-text: #6E675D;
  --todo-box: #C6BDAD;

  --current-bg: #F7F4ED;
  --current-text: #3F3A33;
  --current-box: #B9AF9E;

  --done-bg: #E7EDE6;
  --done-text: #93AB97;
  --done-strike: #B6C8B8;

  position: absolute;
  top: 0;
  left: 0;
  width: var(--w);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  opacity: 1;
  transition: opacity var(--dur) var(--ease);
}

#todo-wrap.hidden { opacity: 0; pointer-events: none; }

/* ───────── header ───────── */
#todo-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 2px 4px;
}

#todo-title {
  font-size: 0.73em;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--head-color);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

#todo-count {
  margin-left: auto;
  font-size: 0.73em;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--count-color);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

#todo-count b { font-weight: 700; }

/* ───────── list ───────── */
#todo-list { display: block; }

.t-row {
  display: flex;
  align-items: center;
  gap: 8px;
  box-sizing: border-box;
  padding: var(--pad-y) var(--pad-x);
  margin-bottom: var(--gap);
  border-radius: var(--radius);
  background: var(--todo-bg);
  overflow: hidden;
  transform-origin: left center;
  transition:
    background-color var(--dur) var(--ease),
    opacity var(--dur) var(--ease),
    transform var(--dur) var(--ease),
    max-height var(--dur) var(--ease),
    margin-bottom var(--dur) var(--ease),
    padding-top var(--dur) var(--ease),
    padding-bottom var(--dur) var(--ease);
}

.t-row:last-child { margin-bottom: 0; }

/* collapsed — used for both the entrance and the exit */
.t-row.collapsed {
  max-height: 0 !important;
  opacity: 0;
  padding-top: 0;
  padding-bottom: 0;
  margin-bottom: 0;
  transform: translateY(-3px);
}

/* the small nudge a row gives when it gets ticked off */
.t-row.pop { animation: t-pop 420ms var(--ease); }
@keyframes t-pop {
  0%   { transform: scale(1); }
  38%  { transform: scale(0.975); }
  100% { transform: scale(1); }
}

/* ───────── mark: empty box, or the tick ───────── */
.t-mark {
  position: relative;
  flex: none;
  width: 0.85em;
  height: 0.85em;
}

.t-box {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  border: 1.5px solid var(--todo-box);
  border-radius: 3px;
  opacity: 1;
  transform: scale(1);
  transition:
    border-color var(--dur) var(--ease),
    opacity 180ms var(--ease),
    transform 220ms var(--ease);
}

.t-tick {
  position: absolute;
  inset: -0.08em;
  width: 1.01em;
  height: 1.01em;
  fill: none;
  stroke: var(--done-text);
  stroke-width: 3.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 26;
  stroke-dashoffset: 26;
  transition: stroke-dashoffset 300ms var(--ease) 90ms, stroke var(--dur) var(--ease);
}

/* ───────── label ───────── */
.t-label {
  color: var(--todo-text);
  font-weight: 500;
  /* line-through is always on, but transparent — fading the colour in is
     what animates, and it keeps working when a task wraps to two lines */
  text-decoration: line-through;
  text-decoration-thickness: 1px;
  text-decoration-color: transparent;
  transition: color var(--dur) var(--ease), text-decoration-color var(--dur) var(--ease);
}

/* ───────── state: the task being worked on right now ───────── */
.t-row.current { background: var(--current-bg); }
.t-row.current .t-box { border-color: var(--current-box); }
.t-row.current .t-label { color: var(--current-text); font-weight: 600; }

/* ───────── state: done ───────── */
.t-row.done { background: var(--done-bg); }
.t-row.done .t-box { opacity: 0; transform: scale(0.6); }
.t-row.done .t-tick { stroke-dashoffset: 0; }
.t-row.done .t-label {
  color: var(--done-text);
  font-weight: 500;
  text-decoration-color: var(--done-strike);
}

/* ───────── empty state ───────── */
#todo-empty {
  display: none;
  padding: var(--pad-y) var(--pad-x);
  border-radius: var(--radius);
  background: var(--todo-bg);
  color: var(--todo-text);
  font-weight: 500;
  opacity: 0.85;
}

#todo-wrap.is-empty #todo-empty { display: block; }
#todo-wrap.is-empty #todo-list { display: none; }

/* optional 1. 2. 3. in front of each task */
.t-num {
  flex: none;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  opacity: 0.55;
  margin-right: -2px;
}


/* ── everything below is the local test harness, not the widget ── */
html, body { margin: 0; height: 100%; }
body { background: #1E1D22; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
#stage { position: fixed; inset: 0; padding: 26px; box-sizing: border-box; }
#panel {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; align-items: center;
  max-width: 92vw; padding: 10px 12px; border-radius: 12px;
  background: #26252E; border: 1px solid rgba(255,255,255,.09);
}
#panel button, #panel input {
  font: 500 12px 'Plus Jakarta Sans', system-ui, sans-serif;
  color: #E8E5EE; background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.11); border-radius: 8px; padding: 7px 11px;
}
#panel button { cursor: pointer; }
#panel button:hover { background: rgba(255,255,255,.14); }
#panel input { width: 210px; }
</style>
</head>
<body>

<div id="stage">
<div id="todo-wrap" class="hidden">
  <div id="todo-head">
    <span id="todo-title">TODAY</span>
    <span id="todo-count"><b id="todo-done">0</b> / <span id="todo-total">0</span></span>
  </div>
  <div id="todo-list"></div>
  <div id="todo-empty">No tasks yet</div>
</div>
</div>

<div id="panel">
  <input id="cmd" value="!task add Read the chat" spellcheck="false">
  <button onclick="send(document.getElementById('cmd').value)">Send</button>
  <button onclick="send('!task next')">!task next</button>
  <button onclick="send('!task add New task from chat')">!task add</button>
  <button onclick="send('!task undone 3')">!task undone 3</button>
  <button onclick="send('!task remove 2')">!task remove 2</button>
  <button onclick="send('!task clear')">!task clear</button>
  <button onclick="location.reload()">Reload</button>
</div>

<script>
/* ── StreamElements shim ── */
var __store = {};
window.SE_API = {
  store: {
    get: function (k) { return Promise.resolve(__store[k]); },
    set: function (k, v) { __store[k] = v; return Promise.resolve(); }
  }
};
function send(text) {
  window.dispatchEvent(new CustomEvent('onEventReceived', { detail: {
    listener: 'message',
    event: { data: { text: text, nick: 'teststreamer', badges: [{ type: 'broadcaster' }] } }
  }}));
}
</script>

<script>
/* ══════════════════════════════════════════════════════════════
   Stream To-Do Overlay
   Chat commands (default prefix !task, aliases in handle()):
     !task add Build the overlay
     !task done 3          !task next
     !task undone 3        !task edit 3 New wording
     !task remove 3        !task clear
   ══════════════════════════════════════════════════════════════ */

var FD = {};                 // fieldData from the widget settings
var CHANNEL = '';            // broadcaster's login name
var tasks = [];              // [{ t: "text", d: true|false }]
var saveTimer = null;
var STORE_KEY = 'todo_overlay_v1';

var $wrap, $list, $done, $total;

/* ─────────────── boot ─────────────── */
window.addEventListener('onWidgetLoad', function (obj) {
  var detail = obj.detail || {};
  FD = detail.fieldData || {};
  CHANNEL = ((detail.channel && detail.channel.username) || '').toLowerCase();

  $wrap  = document.getElementById('todo-wrap');
  $list  = document.getElementById('todo-list');
  $done  = document.getElementById('todo-done');
  $total = document.getElementById('todo-total');

  applyFields();
  load();
});

function applyFields() {
  var s = $wrap.style;
  var px = function (v, fallback) {
    var n = parseFloat(v);
    return (isNaN(n) ? fallback : n) + 'px';
  };

  if (FD.fontFamily) s.setProperty('--font', "'" + FD.fontFamily + "', system-ui, sans-serif");
  s.setProperty('--w', px(FD.width, 262));
  s.setProperty('--fs', px(FD.fontSize, 13));
  s.setProperty('--gap', px(FD.rowGap, 5));
  s.setProperty('--radius', px(FD.cornerRadius, 8));
  s.setProperty('--pad-y', px(FD.rowPaddingY, 7));
  s.setProperty('--pad-x', px(FD.rowPaddingX, 10));
  s.setProperty('--dur', (FD.animations === 'off' ? 0 : (parseInt(FD.animSpeed, 10) || 320)) + 'ms');

  s.setProperty('--head-color',  FD.headColor    || '#DCD6CA');
  s.setProperty('--count-color', FD.countColor   || '#9E988C');
  s.setProperty('--todo-bg',     FD.todoBg       || '#EDE9E0');
  s.setProperty('--todo-text',   FD.todoText     || '#6E675D');
  s.setProperty('--todo-box',    FD.todoBox      || '#C6BDAD');
  s.setProperty('--current-bg',  FD.currentBg    || '#F7F4ED');
  s.setProperty('--current-text',FD.currentText  || '#3F3A33');
  s.setProperty('--current-box', FD.currentBox   || '#B9AF9E');
  s.setProperty('--done-bg',     FD.doneBg       || '#E7EDE6');
  s.setProperty('--done-text',   FD.doneText     || '#93AB97');
  s.setProperty('--done-strike', FD.doneStrike   || '#B6C8B8');

  document.getElementById('todo-title').textContent = FD.headerText || 'TODAY';
  document.getElementById('todo-head').style.display = (FD.showHeader === 'off') ? 'none' : 'flex';
  document.getElementById('todo-count').style.display = (FD.showCounter === 'off') ? 'none' : 'block';
  document.getElementById('todo-empty').textContent = FD.emptyText || 'No tasks yet';
}

/* ─────────────── storage ─────────────── */
function load() {
  var seed = function () {
    tasks = String(FD.starterTasks || '')
      .split(/[\n|]/)
      .map(function (x) { return x.trim(); })
      .filter(Boolean)
      .map(function (x) { return { t: x, d: false }; });
  };

  if (typeof SE_API === 'undefined' || !SE_API.store) { seed(); renderAll(); return; }

  SE_API.store.get(STORE_KEY).then(function (data) {
    if (data && Object.prototype.toString.call(data.tasks) === '[object Array]') tasks = data.tasks;
    else seed();
    renderAll();
  }).catch(function () { seed(); renderAll(); });
}

function save() {
  if (typeof SE_API === 'undefined' || !SE_API.store) return;
  clearTimeout(saveTimer);
  // debounced: SE throttles store writes
  saveTimer = setTimeout(function () {
    SE_API.store.set(STORE_KEY, { tasks: tasks });
  }, 800);
}

/* ─────────────── chat ─────────────── */
window.addEventListener('onEventReceived', function (obj) {
  var detail = obj.detail || {};
  if (detail.listener !== 'message') return;

  var data = (detail.event && detail.event.data) || {};
  var raw = String(data.text || '').trim();
  var prefix = String(FD.command || '!task').toLowerCase();
  var lower = raw.toLowerCase();

  if (lower !== prefix && lower.indexOf(prefix + ' ') !== 0) return;
  if (!allowed(data)) return;

  handle(raw.slice(prefix.length).trim());
});

function allowed(data) {
  var level = FD.permission || 'mods';
  if (level === 'everyone') return true;

  var badges = data.badges || [];
  var has = function (type) {
    for (var i = 0; i < badges.length; i++) if (badges[i].type === type) return true;
    return false;
  };
  var isBroadcaster = has('broadcaster') || String(data.nick || '').toLowerCase() === CHANNEL;

  if (level === 'broadcaster') return isBroadcaster;
  return isBroadcaster || has('moderator');   // 'mods'
}

function handle(rest) {
  if (!rest) return;

  var sp = rest.indexOf(' ');
  var verb = (sp < 0 ? rest : rest.slice(0, sp)).toLowerCase();
  var arg = sp < 0 ? '' : rest.slice(sp + 1).trim();

  switch (verb) {
    case 'add': case 'a': case '+':
      addTask(arg); break;

    case 'done': case 'd': case 'check': case 'x':
      setDone(num(arg), true); break;

    case 'undone': case 'u': case 'uncheck':
      setDone(num(arg), false); break;

    case 'next': case 'n':
      setDone(firstOpen(), true); break;

    case 'edit': case 'e':
      var esp = arg.indexOf(' ');
      if (esp > 0) editTask(num(arg.slice(0, esp)), arg.slice(esp + 1).trim());
      break;

    case 'remove': case 'rm': case 'del': case 'delete': case '-':
      removeTask(num(arg)); break;

    case 'clear': case 'reset':
      clearAll(); break;
  }
}

function num(s) { return parseInt(s, 10) - 1; }              // chat is 1-based
function firstOpen() {
  for (var i = 0; i < tasks.length; i++) if (!tasks[i].d) return i;
  return -1;
}
function valid(i) { return i >= 0 && i < tasks.length; }

/* ─────────────── mutations ─────────────── */
function addTask(text) {
  text = String(text || '').trim().slice(0, parseInt(FD.maxLength, 10) || 80);
  if (!text) return;
  if (tasks.length >= (parseInt(FD.maxTasks, 10) || 8)) return;

  tasks.push({ t: text, d: false });
  var row = buildRow(tasks[tasks.length - 1]);
  row.classList.add('collapsed');
  $list.appendChild(row);
  expand(row);
  refresh();
  save();
}

function setDone(i, state) {
  if (!valid(i) || tasks[i].d === state) return;
  tasks[i].d = state;

  var row = $list.children[i];
  if (row && state) {
    row.classList.add('pop');
    setTimeout(function () { row.classList.remove('pop'); }, 460);
  }
  refresh();
  save();
}

function editTask(i, text) {
  text = String(text || '').trim().slice(0, parseInt(FD.maxLength, 10) || 80);
  if (!valid(i) || !text) return;
  tasks[i].t = text;
  var label = $list.children[i] && $list.children[i].querySelector('.t-label');
  if (label) label.textContent = text;
  save();
}

function removeTask(i) {
  if (!valid(i)) return;
  var row = $list.children[i];
  tasks.splice(i, 1);
  save();

  if (!row) { renderAll(); return; }
  collapse(row, function () {
    row.parentNode && row.parentNode.removeChild(row);
    renumber();
    refresh();
  });
}

function clearAll() {
  tasks = [];
  save();
  var rows = Array.prototype.slice.call($list.children);
  if (!rows.length) { refresh(); return; }
  rows.forEach(function (row, n) {
    setTimeout(function () {
      collapse(row, function () { row.parentNode && row.parentNode.removeChild(row); refresh(); });
    }, n * 45);
  });
}

/* ─────────────── rendering ─────────────── */
function renderAll() {
  $list.innerHTML = '';
  tasks.forEach(function (task, i) {
    var row = buildRow(task);
    row.classList.add('collapsed');
    $list.appendChild(row);
    setTimeout(function () { expand(row); }, i * 60);   // gentle stagger on load
  });
  renumber();
  refresh();
}

function buildRow(task) {
  var row = document.createElement('div');
  row.className = 't-row';

  var html = '';
  if (FD.showNumbers === 'on') html += '<span class="t-num"></span>';
  html +=
    '<span class="t-mark">' +
      '<span class="t-box"></span>' +
      '<svg class="t-tick" viewBox="0 0 24 24"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg>' +
    '</span>' +
    '<span class="t-label"></span>';

  row.innerHTML = html;
  row.querySelector('.t-label').textContent = task.t;   // textContent — chat input is never parsed as HTML
  return row;
}

function renumber() {
  if (FD.showNumbers !== 'on') return;
  for (var i = 0; i < $list.children.length; i++) {
    var n = $list.children[i].querySelector('.t-num');
    if (n) n.textContent = (i + 1) + '.';
  }
}

/* keeps classes, counter and visibility in sync with `tasks` */
function refresh() {
  var open = firstOpen();

  for (var i = 0; i < $list.children.length; i++) {
    var row = $list.children[i];
    var task = tasks[i];
    if (!task) continue;
    row.classList.toggle('done', !!task.d);
    row.classList.toggle('current', i === open);
  }

  var doneCount = tasks.filter(function (x) { return x.d; }).length;
  $done.textContent = doneCount;
  $total.textContent = tasks.length;

  // only call it empty once the leaving rows have finished animating out
  var empty = tasks.length === 0 && $list.children.length === 0;
  $wrap.classList.toggle('is-empty', empty);
  $wrap.classList.toggle('hidden', empty && FD.hideWhenEmpty === 'on');
}

/* ─────────────── height animation helpers ─────────────── */
function expand(row) {
  // measure the row at its natural height, then play it open from collapsed
  row.style.maxHeight = 'none';
  row.classList.remove('collapsed');
  var h = row.scrollHeight;

  row.classList.add('collapsed');
  row.style.maxHeight = '';
  void row.offsetHeight;                 // force the browser to take the collapsed state

  row.style.maxHeight = h + 'px';
  row.classList.remove('collapsed');
  setTimeout(function () { row.style.maxHeight = 'none'; }, parseInt(FD.animSpeed, 10) || 320);
}

function collapse(row, done) {
  row.style.maxHeight = row.scrollHeight + 'px';
  void row.offsetHeight;                 // force the browser to take that height
  row.classList.add('collapsed');
  setTimeout(done, (parseInt(FD.animSpeed, 10) || 320) + 40);
}

</script>

<script>
window.dispatchEvent(new CustomEvent('onWidgetLoad', { detail: {
  channel: { username: 'teststreamer' },
  fieldData: {
  "headerText": "TODAY",
  "showHeader": "on",
  "showCounter": "on",
  "showNumbers": "off",
  "width": 262,
  "fontSize": 13,
  "fontFamily": "Plus Jakarta Sans",
  "rowGap": 5,
  "cornerRadius": 8,
  "rowPaddingY": 7,
  "rowPaddingX": 10,
  "headColor": "#DCD6CA",
  "countColor": "#9E988C",
  "todoBg": "#EDE9E0",
  "todoText": "#6E675D",
  "todoBox": "#C6BDAD",
  "currentBg": "#F7F4ED",
  "currentText": "#3F3A33",
  "currentBox": "#B9AF9E",
  "doneBg": "#E7EDE6",
  "doneText": "#93AB97",
  "doneStrike": "#B6C8B8",
  "command": "!task",
  "permission": "mods",
  "maxTasks": 8,
  "maxLength": 80,
  "starterTasks": "Stream intro + chat|Warm-up games|Build the to-do overlay|Viewer submissions|Q&A + outro",
  "animations": "on",
  "animSpeed": 320,
  "hideWhenEmpty": "on",
  "emptyText": "No tasks yet"
}
}}));
</script>

</body>
</html>
