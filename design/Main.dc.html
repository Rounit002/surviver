<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #8FAE97; } a:hover { color: #74957D; }
  </style>
</helmet>

<div style="width: 460px; height: 340px; background: #1E1D22; box-sizing: border-box; padding: 26px; display: flex; align-items: flex-start;">

  <div style="width: 262px; display: flex; flex-direction: column; gap: 5px;">

    <div style="display: flex; align-items: center; gap: 7px; padding: 0 2px 3px;">
      <div style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.15em; color: #DCD6CA; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);">TODAY</div>
      <div style="margin-left: auto; font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; color: #9E988C; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);">2 / 5</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #E7EDE6; border-radius: 8px; padding: 7px 10px;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#93AB97" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg>
      <div style="font-size: 12.5px; font-weight: 500; color: #93AB97; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #B6C8B8;">Stream intro + chat</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #E7EDE6; border-radius: 8px; padding: 7px 10px;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#93AB97" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg>
      <div style="font-size: 12.5px; font-weight: 500; color: #93AB97; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: #B6C8B8;">Warm-up games</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #F7F4ED; border-radius: 8px; padding: 7px 10px;">
      <div style="width: 11px; height: 11px; flex: none; border-radius: 3px; border: 1.5px solid #B9AF9E; box-sizing: border-box;"></div>
      <div style="font-size: 12.5px; font-weight: 600; color: #3F3A33;">Build the to-do overlay</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #EDE9E0; border-radius: 8px; padding: 7px 10px;">
      <div style="width: 11px; height: 11px; flex: none; border-radius: 3px; border: 1.5px solid #C6BDAD; box-sizing: border-box;"></div>
      <div style="font-size: 12.5px; font-weight: 500; color: #6E675D;">Viewer submissions</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #EDE9E0; border-radius: 8px; padding: 7px 10px;">
      <div style="width: 11px; height: 11px; flex: none; border-radius: 3px; border: 1.5px solid #C6BDAD; box-sizing: border-box;"></div>
      <div style="font-size: 12.5px; font-weight: 500; color: #6E675D;">Q&amp;A + outro</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
