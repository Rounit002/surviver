# Render blueprint. Optional — you can create the service by hand in the
# dashboard with the same build/start commands instead.
#
# Every secret below is `sync: false`, which means Render will NOT read a value
# from this file; you set it once in the dashboard. Nothing sensitive is
# committed here.

services:
  - type: web
    name: surviver
    runtime: node
    plan: free
    region: oregon
    branch: main

    # `npm ci` installs exactly what package-lock.json pins, and the postinstall
    # hook runs `prisma generate`. `migrate deploy` applies any pending
    # migrations to the Supabase database before the new build is started; it
    # never creates a shadow database, so it is safe to run on every deploy.
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start

    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Supabase Postgres connection string. See README for which of the three
      # Supabase connection strings to use.
      - key: DATABASE_URL
        sync: false

      # Public origin of the deployed site, no trailing slash. Rally links and
      # share URLs are built from this, so it must be the real hostname.
      - key: APP_URL
        sync: false

      # Salt for hashing visitor IPs. Raw addresses are never stored, and
      # changing this invalidates existing visitor de-duplication.
      - key: IP_HASH_SALT
        generateValue: true

      # Shared secret the scheduled round-transition job must present.
      - key: CRON_SECRET
        generateValue: true

      - key: SECURITY_SECRET
        generateValue: true

      - key: PAYMENT_PROVIDER
        value: dodo

      - key: DODO_PAYMENTS_ENVIRONMENT
        value: live_mode

      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_PRODUCT_ID
        sync: false
      - key: DODO_PAYMENTS_BUSINESS_ID
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
